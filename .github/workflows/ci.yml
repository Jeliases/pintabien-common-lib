name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        run: ./mvnw -B verify
      - name: Publish to GitHub Packages (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<XML
          <settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${GITHUB_TOKEN}</password></server></servers></settings>
          XML
          ./mvnw -B -DskipTests -Dgithub.owner=${{ github.repository_owner }} deploy
